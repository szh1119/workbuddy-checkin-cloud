name: Token 连通性验证（只读，不签到）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 仅查询签到状态，不调用领取接口
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          t = os.environ.get("WB_ACCESS_TOKEN", "")
          print("TOKEN_LEN", len(t))
          req = urllib.request.Request(
              "https://copilot.tencent.com/v2/billing/meter/checkin-activity-status",
              data=b"{}", method="POST",
              headers={"Content-Type": "application/json", "Accept": "application/json",
                       "Authorization": "Bearer " + t, "User-Agent": "WorkBuddy"})
          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  print("VERIFY_HTTP", r.status)
                  print("VERIFY_BODY", r.read().decode("utf-8", "replace")[:600])
          except urllib.error.HTTPError as e:
              print("VERIFY_HTTP", e.code)
              print("VERIFY_BODY", e.read().decode("utf-8", "replace")[:600])
          except Exception as e:
              print("VERIFY_ERROR", type(e).__name__, str(e)[:200])
          PY
